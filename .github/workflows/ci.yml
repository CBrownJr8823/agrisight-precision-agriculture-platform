name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — Type Check and Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build

  backend:
    name: Backend — Dependency and Import Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate ML engines load
        run: |
          python -c "from backend.ml_engine import vision_engine, yield_engine; assert vision_engine.loaded, 'Vision engine did not load'; assert yield_engine.loaded, 'Yield engine did not load'; print('ML engines loaded successfully')"

      - name: Validate FastAPI application imports
        run: |
          python -c "from backend.main import app; assert app.title == 'AgriSight Precision Agriculture API'; print('FastAPI app imported successfully')"
